version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: task-manager-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-task_manager_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskmanager}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - task-manager-net

  # Express Backend
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: task-manager-server
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-5000}
      POSTGRES_URL: postgresql://${POSTGRES_USER:-taskmanager}:${POSTGRES_PASSWORD:-password123}@postgres:5432/${POSTGRES_DB:-task_manager_dev}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-key-change-in-production}
      JWT_EXPIRE: ${JWT_EXPIRE:-15m}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE:-7d}
    ports:
      - "${PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - task-manager-net

  # React Frontend (Vite)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: task-manager-client
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
      VITE_APP_NAME: ${VITE_APP_NAME:-Task Manager}
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - task-manager-net

volumes:
  postgres_data:

networks:
  task-manager-net:
    driver: bridge
